name: Slot Monitor

on:
  workflow_dispatch:

concurrency:
  group: slot-monitor
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install tesseract OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr

      - name: Restore alert state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Write config from secrets
        shell: pwsh
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          API_BASE: ${{ secrets.API_BASE }}
          CVS_SESSION: ${{ secrets.CVS_SESSION }}
        run: |
          $cfg = [ordered]@{
            email = ""
            password = ""
            apiBase = $env:API_BASE
            pollMinutes = 1
            startHour = 0
            endHour = 24
            country = "India"
            city = ""
            visaType = ""
            communityLimit = 10
            alertOnChange = $true
            telegramToken = $env:TG_TOKEN
            telegramChatIds = @($env:TG_CHAT_IDS | ConvertFrom-Json)
            staleSeconds = 300
            cvsApiBase = "https://checkvisaslots.com/api/backend/core/retrieve/v1/"
            cvsSession = $env:CVS_SESSION
            cvsIntervalHours = 1
            ownerChatId = "8877739081"
            stateFile = "state.json"
            logFile = "log.txt"
          }
          Set-Content -LiteralPath config.json -Value ($cfg | ConvertTo-Json) -Encoding UTF8

      - name: Poll visa slots API
        shell: pwsh
        run: ./monitor.ps1 -Once -NoToast

      - name: Save alert state
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: state.json
          key: state-${{ github.run_id }}